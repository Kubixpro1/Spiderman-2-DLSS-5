name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DLSS5Manager src/DLSS5Manager.py
          $hash = (Get-FileHash dist/DLSS5Manager.exe -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Out-File build-metadata.txt -Encoding utf8
          "VERSION=$((Get-Content config/version.json -Raw | ConvertFrom-Json).app.version)" | Out-File build-metadata.txt -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLSS5Manager-windows
          path: |
            dist/DLSS5Manager.exe
            build-metadata.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DLSS5Manager.exe
          generate_release_notes: true

      - name: Publish EXE SHA-256 to version.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $hash = (Get-FileHash dist/DLSS5Manager.exe -Algorithm SHA256).Hash.ToLower()
          $raw = gh api "repos/$env:REPO/contents/config/version.json"
          $obj = $raw | ConvertFrom-Json
          $content = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($obj.content)) | ConvertFrom-Json
          $content.app.sha256 = $hash
          $json = $content | ConvertTo-Json -Depth 10
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json + "`n"))
          gh api --method PUT "repos/$env:REPO/contents/config/version.json" -f message="Publish release SHA-256" -f content="$encoded" -f sha="$($obj.sha)" | Out-Null

name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $version = (Get-Content config/version.json -Raw | ConvertFrom-Json).app.version
          pyinstaller --noconfirm --clean --onefile --windowed --name DLSS5Manager src/DLSS5Manager.py
          $hash = (Get-FileHash dist/DLSS5Manager.exe -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Out-File build-metadata.txt -Encoding utf8
          "VERSION=$version" | Out-File build-metadata.txt -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLSS5Manager-windows
          path: |
            dist/DLSS5Manager.exe
            build-metadata.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DLSS5Manager.exe
          generate_release_notes: true
